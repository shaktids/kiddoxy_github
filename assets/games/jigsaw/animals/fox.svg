<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="540" height="360" fill="url(#sky)"/>
  <!-- simple meadow -->
  <rect x="0" y="250" width="540" height="110" fill="#86efac"/>
  <!-- fox body -->
  <g transform="translate(160,120) scale(1.2)">
    <ellipse cx="120" cy="80" rx="90" ry="50" fill="#f97316"/>
    <polygon points="30,80 0,60 10,100" fill="#f97316"/>
    <polygon points="210,80 240,60 230,100" fill="#f97316"/>
    <!-- head -->
    <path d="M70,40 C90,10 150,10 170,40 C170,60 150,80 120,80 C90,80 70,60 70,40 Z" fill="#f97316"/>
    <!-- ears -->
    <polygon points="90,12 80,40 110,28" fill="#f97316"/>
    <polygon points="150,12 130,28 160,40" fill="#f97316"/>
    <!-- face -->
    <ellipse cx="110" cy="55" rx="14" ry="10" fill="#fff"/>
    <ellipse cx="130" cy="55" rx="14" ry="10" fill="#fff"/>
    <circle cx="110" cy="55" r="4" fill="#111"/>
    <circle cx="130" cy="55" r="4" fill="#111"/>
    <circle cx="120" cy="70" r="4" fill="#111"/>
    <!-- tail -->
    <path d="M30,90 C10,110 20,140 60,150" fill="#f97316" stroke="#f97316" stroke-width="12"/>
    <circle cx="60" cy="150" r="10" fill="#fff"/>
  </g>
  <!-- sun -->
  <circle cx="470" cy="70" r="28" fill="#fde047"/>
</svg>