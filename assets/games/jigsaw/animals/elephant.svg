<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="540" height="360" fill="url(#bg)"/>
  <rect x="0" y="250" width="540" height="110" fill="#a7f3d0"/>
  <!-- elephant -->
  <g transform="translate(130,110) scale(1.2)">
    <ellipse cx="150" cy="90" rx="110" ry="60" fill="#64748b"/>
    <!-- head -->
    <ellipse cx="90" cy="70" rx="50" ry="40" fill="#64748b"/>
    <!-- trunk -->
    <path d="M60,95 C40,110 40,140 70,150 C90,156 100,145 100,135" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <!-- ear -->
    <ellipse cx="60" cy="80" rx="24" ry="28" fill="#94a3b8"/>
    <!-- eye -->
    <circle cx="100" cy="70" r="6" fill="#111"/>
    <!-- tail -->
    <path d="M255,95 C270,110 270,130 260,140" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- clouds -->
  <ellipse cx="420" cy="80" rx="70" ry="22" fill="#fff" opacity="0.85"/>
  <ellipse cx="470" cy="100" rx="60" ry="20" fill="#fff" opacity="0.85"/>
</svg>