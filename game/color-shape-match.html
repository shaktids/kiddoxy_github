<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color & Shape Match</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --bg-top: #bff7ff;
      --bg-mid: #9ed8ff;
      --bg-bottom: #7dc2ff;
      --surface: #ffffffde;
      --ink: #09325a;
      --muted: #0b4f88;
      --accent: #ff6b6b;
      --ok: #22c55e;
      --warn: #ef4444;
      --card-bg: #ffffffde;
      --accent-dark: #ec4d4d;
      --btn-dark: #1d4ed8;
      --btn-dark-2: #1e40af;
      --tile-border: #d7e9ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #ffffffbb 0 12%, transparent 13%),
        radial-gradient(circle at 85% 16%, #fff7cf99 0 14%, transparent 15%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 54%, var(--bg-bottom) 100%);
      padding-bottom: 92px;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(560px, 96vw);
      margin: 10px auto;
    }

    .csm-shell {
      width: 100%;
      margin: 0;
      padding: 14px;
      border-radius: 24px;
      border: 3px solid #ffffffbf;
      background: var(--card-bg);
      box-shadow: 0 20px 32px #124f9440;
      backdrop-filter: blur(3px);
    }

    .csm-header {
      text-align: center;
      margin-bottom: 10px;
      animation: csm-fade 420ms ease-out;
    }

    .csm-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffffffed;
      border: 2px solid #ffcfd8;
      box-shadow: 0 9px 16px #fb718554;
    }

    .csm-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(145deg, #fb7185, #ef4444);
    }

    .csm-title-text {
      font-size: clamp(1.22rem, 4vw, 2.15rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: 0.2px;
    }

    .csm-subtext {
      margin-top: 8px;
      font-size: clamp(0.9rem, 2.9vw, 1.08rem);
      font-weight: 700;
      color: #0b4f88;
    }

    .helper {
      margin: 8px 0 0;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .csm-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0 14px;
    }

    .status-row {
      margin-top: 12px;
    }

    .csm-chip {
      background: #f8fbff;
      border: 2px solid #d9ebff;
      border-radius: 12px;
      min-height: 56px;
      display: grid;
      place-content: center;
      text-align: center;
      font-weight: 800;
      line-height: 1.2;
      box-shadow: inset 0 0 0 1px #fff;
    }

    .csm-chip strong { font-size: clamp(1rem, 3.5vw, 1.4rem); }

    .csm-prompt {
      text-align: center;
      font-size: clamp(1.15rem, 4.1vw, 1.8rem);
      font-weight: 800;
      margin: 6px 0 12px;
    }

    .csm-target {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
      min-height: 92px;
    }

    .csm-target canvas {
      width: clamp(76px, 24vw, 108px);
      height: auto;
      border-radius: 14px;
      padding: 8px;
      background: #ffffffa3;
      border: 2px solid #dcecff;
      box-shadow: 0 8px 12px #0b3a6b26;
    }

    .csm-shapes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .csm-shape {
      min-height: clamp(78px, 16vw, 108px);
      border-radius: 16px;
      border: 2px solid var(--tile-border);
      background: #ffffffcc;
      box-shadow: 0 8px 14px #0f357121;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
      touch-action: manipulation;
    }

    .csm-shape canvas {
      width: clamp(50px, 11vw, 74px);
      height: auto;
    }

    .csm-shape:hover {
      border-color: #9ac3ff;
      transform: translateY(-2px);
    }

    .csm-shape:active { transform: scale(0.95); }

    .csm-shape.correct {
      border-color: #34d399;
      box-shadow: 0 0 0 4px #34d39966;
      transform: scale(1.02);
    }

    .csm-shape.wrong {
      border-color: #f87171;
      box-shadow: 0 0 0 4px #f8717163;
      animation: csm-shake .2s ease;
    }

    .csm-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .board {
      border: 2px solid #d9ebff;
      border-radius: 16px;
      padding: 12px;
      background: #ffffffc4;
    }

    .fixed-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(191,247,255,0), rgba(191,247,255,0.97));
      backdrop-filter: blur(4px);
    }

    .csm-controls button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: transform .14s ease;
    }

    #csmRestart {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
      box-shadow: 0 8px 14px #fb718563;
    }

    #csmHint {
      background: linear-gradient(180deg, var(--btn-dark) 0%, var(--btn-dark-2) 100%);
      box-shadow: 0 8px 14px #1d4ed860;
    }

    .csm-controls button:active { transform: scale(0.98); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes csm-fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes csm-shake {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    @media (max-width: 780px) {
      .csm-shell {
        width: 100%;
        padding: 11px;
        border-radius: 18px;
      }

      .csm-shapes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .csm-shell {
        margin: 10px auto 12px;
        padding: 10px;
      }

      .csm-title-wrap {
        gap: 8px;
        padding: 8px 10px;
      }

      .csm-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }

      .csm-stats {
        grid-template-columns: 1fr;
      }

      .fixed-controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
  <main class="csm-shell shell" aria-label="Color and Shape Match Game">
    <div class="csm-header">
      <div class="csm-title-wrap">
        <span class="csm-icon">🎨</span>
        <span class="csm-title-text">Color & Shape Match</span>
      </div>
      <p class="helper csm-subtext">Match the exact color and shape pair to score points.</p>
    </div>

    <div class="csm-stats status-row" aria-live="polite">
      <div class="csm-chip">⭐ Score<br><strong id="csmScore">0</strong></div>
      <div class="csm-chip">🎯 Goal<br><strong>Find the same one</strong></div>
    </div>

    <section class="board">
    <div class="csm-prompt">Pick the matching shape:</div>
    <div class="csm-target" id="csmTarget"></div>
    <div class="csm-shapes" id="csmShapes"></div>
    </section>

    <div class="csm-controls fixed-controls">
      <button id="csmRestart">Restart</button>
      <button id="csmHint">Hint</button>
    </div>
  </main>
  </div>

  <div id="csmAnnounce" class="sr-only" aria-live="assertive"></div>

  <script src="/scripts/color-shape-match.js"></script>
  <div id="ageModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Age verification">
    <div class="modal-content">
      <h2>Are you a parent?</h2>
      <p>Please enter your birth year to continue to parental settings.</p>
      <input id="birthYear" type="number" placeholder="e.g. 1980" min="1900" max="2025" />
      <div class="modal-actions">
        <button id="ageSubmit">Confirm</button>
        <button id="ageCancel" class="secondary">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module">
    import { injectNavbar } from '/scripts/navbar-footer.js';
    injectNavbar();
    // Wire up parental modal logic after navbar injection
    window.addEventListener('DOMContentLoaded', () => {
      var parentBtn = document.getElementById('parent-btn');
      if (parentBtn) {
        parentBtn.addEventListener('click', function(){
          if (typeof showParentalGate === 'function') showParentalGate();
        });
      }
      var ageSubmit = document.getElementById('ageSubmit');
      if (ageSubmit) {
        ageSubmit.addEventListener('click', function(){
          const year = parseInt(document.getElementById('birthYear').value || '0', 10);
          if (isNaN(year)) return;
          if (typeof handleParentalConfirm === 'function') handleParentalConfirm(year);
        });
      }
      var ageCancel = document.getElementById('ageCancel');
      if (ageCancel) {
        ageCancel.addEventListener('click', function(){
          if (typeof closeParentalModal === 'function') closeParentalModal();
        });
      }
    });
  </script>
  <script src="/game-shell.js"></script>
</body>
</html>
