<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sorting Hero</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    :root {
      --bg-top: #a8e6ff;
      --bg-bottom: #0ea5e9;
      --surface: #ffffffea;
      --ink: #0f4c81;
      --muted: #3d7fa0;
      --accent: #0ea5e9;
      --accent-2: #06b6d4;
      --shadow: 0 14px 28px rgba(15, 76, 129, 0.14);
      --item-size: 140px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Baloo 2", "Trebuchet MS", "Comic Sans MS", sans-serif;
      color: var(--ink);
    }

    body {
      background:
        radial-gradient(circle at 88% 14%, #ffffffcc 0 12%, transparent 13%),
        radial-gradient(circle at 10% 85%, #fff5d5ba 0 14%, transparent 15%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .shell {
      width: min(980px, 96vw);
      margin: 12px auto;
      padding: 12px;
      border-radius: 22px;
      background: var(--surface);
      border: 2px solid #ffffffcc;
      box-shadow: var(--shadow);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .title-icon {
      font-size: 2em;
      flex-shrink: 0;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.4em;
      font-weight: 800;
      flex: 1;
      min-width: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      justify-content: flex-start;
    }

    .stats {
      background: rgba(14, 165, 233, 0.15);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.9em;
      white-space: nowrap;
      flex: 1;
      min-width: 90px;
      text-align: center;
    }

    .btn {
      background: linear-gradient(180deg, var(--accent), #0284c7);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 0 6px 12px rgba(14, 165, 233, 0.24);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.secondary {
      background: #f0f0f0;
      color: var(--ink);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
    }

    .helper {
      text-align: center;
      color: var(--muted);
      font-size: 0.95em;
      margin: 8px 0 12px;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .hero-item {
      background: linear-gradient(135deg, #e0f7ff, #b3efff);
      border: 3px solid #7dd3fc;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.2);
      border-radius: 18px;
      width: var(--item-size);
      height: var(--item-size);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4em;
      margin: 0 auto 20px;
      user-select: none;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
    }

    .choice-btn {
      background: linear-gradient(135deg, #e0f7ff, #b3efff);
      border: 3px solid #7dd3fc;
      border-radius: 14px;
      padding: 16px 12px;
      min-height: 80px;
      font-size: 1.2em;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
    }

    .choice-btn:active {
      transform: scale(0.96);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.25);
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.25);
    }

    .feedback {
      font-size: 1.3em;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent);
      min-height: 24px;
      text-align: center;
    }

    .score {
      font-size: 1.1em;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
    }

    .howto-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1001;
      background: linear-gradient(180deg, var(--accent), #0284c7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.3);
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .howto-btn:active {
      transform: scale(0.92);
    }

    .howto-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1202;
      padding: 14px;
    }

    .howto-modal.open {
      display: flex;
    }

    .howto-dialog {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      max-width: 400px;
      text-align: center;
    }

    .howto-dialog h2 {
      margin: 0 0 12px;
      color: var(--ink);
    }

    .howto-dialog p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .ad-banner {
      height: 60px;
      background: rgba(255, 255, 255, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85em;
      color: var(--muted);
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      :root { --item-size: 120px; }
      .hero-item {
        font-size: 3.5em;
        margin-bottom: 16px;
      }
      .choice-btn {
        padding: 14px 10px;
        min-height: 70px;
        font-size: 1.1em;
      }
      .btn {
        padding: 8px 12px;
        font-size: 0.9em;
      }
    }

    @media (max-width: 600px) {
      :root { --item-size: 100px; }
      main {
        padding: 8px;
      }
      .shell {
        width: min(100%, 96vw);
        margin: 8px auto;
        border-radius: 14px;
        padding: 10px;
      }
      header {
        margin-bottom: 10px;
      }
      .title-wrap h1 {
        font-size: 1.2em;
      }
      .title-icon {
        font-size: 1.6em;
      }
      .controls {
        gap: 6px;
        width: 100%;
      }
      .stats {
        padding: 5px 10px;
        font-size: 0.8em;
        min-width: 80px;
        flex: 1;
      }
      .btn {
        padding: 7px 10px;
        font-size: 0.85em;
        flex: 1;
        min-width: 70px;
      }
      .helper {
        font-size: 0.85em;
        margin: 6px 0 10px;
      }
      .hero-item {
        font-size: 3em;
        margin-bottom: 12px;
      }
      .choices {
        gap: 10px;
        margin-bottom: 12px;
      }
      .choice-btn {
        padding: 12px 8px;
        min-height: 60px;
        font-size: 1em;
        border-radius: 12px;
      }
      .feedback {
        font-size: 1.1em;
        margin-bottom: 8px;
      }
      .score {
        font-size: 1em;
      }
      .howto-btn {
        width: 48px;
        height: 48px;
        right: 10px;
        bottom: 10px;
        font-size: 24px;
      }
    }

    @media (max-width: 480px) {
      :root { --item-size: 88px; }
      .title-wrap h1 {
        font-size: 1.1em;
      }
      .title-icon {
        font-size: 1.4em;
      }
      .controls {
        flex-direction: column;
      }
      .stats,
      .btn {
        width: 100%;
        text-align: center;
      }
      .hero-item {
        font-size: 2.5em;
        margin-bottom: 12px;
      }
      .choice-btn {
        padding: 12px 8px;
        min-height: 56px;
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="shell">
      <header>
        <div class="title-wrap">
          <span class="title-icon">🎯</span>
          <h1>Sorting Hero</h1>
        </div>
        <div class="controls">
          <div class="stats">Score: <strong id="score">0</strong></div>
          <button id="btnShuffle" class="btn">Restart</button>
        </div>
      </header>

      <p class="helper">Pick the correct category for each item!</p>

      <main>
        <div class="center">
          <div class="hero-item" id="heroItem">🐱</div>
          <div id="feedback" class="feedback"></div>
          <div class="choices">
            <button class="choice-btn" id="choiceA">Animal</button>
            <button class="choice-btn" id="choiceB">Bird</button>
          </div>
        </div>
      </main>

      <div class="ad-banner" aria-hidden="true">AD_BANNER_PLACEHOLDER</div>
    </div>
  </div>

  <button class="howto-btn" id="howtoBtn" title="How to Play" aria-label="How to Play">?</button>
  <div id="howtoModal" class="howto-modal" role="dialog" aria-modal="true" aria-labelledby="howtoTitle">
    <div class="howto-dialog">
      <h2 id="howtoTitle">How to Play</h2>
      <p>Look at the emoji and pick the correct category below. Get as many right as you can!</p>
      <button id="howtoClose" class="btn" style="margin-top:12px;">Got It!</button>
    </div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      // How to Play modal
      const howtoBtn = document.getElementById('howtoBtn');
      const howtoModal = document.getElementById('howtoModal');
      const howtoClose = document.getElementById('howtoClose');
      if (howtoBtn && howtoModal && howtoClose) {
        howtoBtn.addEventListener('click', () => {
          howtoModal.classList.add('open');
        });
        howtoClose.addEventListener('click', () => {
          howtoModal.classList.remove('open');
        });
        howtoModal.addEventListener('click', (e) => {
          if (e.target === howtoModal) howtoModal.classList.remove('open');
        });
      }

      // --- Audio helpers ---
      let _audioCtx = null;
      function getAudioCtx(){
        if(!_audioCtx || _audioCtx.state === 'closed'){
          const AC = window.AudioContext || window.webkitAudioContext;
          if(!AC) return null;
          _audioCtx = new AC();
        }
        return _audioCtx;
      }
      function playBeep(freq=660, duration=0.08, type='sine', volume=0.25){
        const ac = getAudioCtx(); if(!ac) return;
        if(ac.state === 'suspended'){ try{ ac.resume(); }catch(_){} }
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type; osc.frequency.value = freq;
        const now = ac.currentTime;
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain).connect(ac.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      // Celebration (balloons)
      window.Celebration = {
        celebrate: function() {
          for(let i=0;i<18;i++){
            const b=document.createElement('div');
            b.style.position='fixed';
            b.style.left=(Math.random()*100)+'vw';
            b.style.top='-80px';
            b.style.width='48px';
            b.style.height='64px';
            b.style.borderRadius='50% 50% 45% 45%';
            b.style.background=['#ff6b6b','#4ecdc4','#51cf66','#ffd93d','#a855f7','#f97316'][Math.floor(Math.random()*6)];
            b.style.boxShadow='0 4px 16px rgba(0,0,0,0.13)';
            b.style.zIndex=2000;
            b.style.transition='transform 2.2s cubic-bezier(.22,.61,.36,1), opacity .6s';
            document.body.appendChild(b);
            setTimeout(()=>{b.style.transform='translateY(110vh)';b.style.opacity='0.1';},50+Math.random()*200);
            setTimeout(()=>{b.remove();},2200+Math.random()*400);
          }
        }
      };

      // Game logic
      const items = [
        { emoji: '🐱', type: 'Animal' },
        { emoji: '🐶', type: 'Animal' },
        { emoji: '🦁', type: 'Animal' },
        { emoji: '🐯', type: 'Animal' },
        { emoji: '🐮', type: 'Animal' },
        { emoji: '🐵', type: 'Animal' },
        { emoji: '🐘', type: 'Animal' },
        { emoji: '🐼', type: 'Animal' },
        { emoji: '🐦', type: 'Bird' },
        { emoji: '🦉', type: 'Bird' },
        { emoji: '🦅', type: 'Bird' },
        { emoji: '🦆', type: 'Bird' },
        { emoji: '🐧', type: 'Bird' },
        { emoji: '🦜', type: 'Bird' },
        { emoji: '🦢', type: 'Bird' },
        { emoji: '🐟', type: 'Fish' },
        { emoji: '🐠', type: 'Fish' },
        { emoji: '🐡', type: 'Fish' },
        { emoji: '🦈', type: 'Fish' },
        { emoji: '🐬', type: 'Fish' },
        { emoji: '🐳', type: 'Fish' },
        { emoji: '🐋', type: 'Fish' }
      ];
      const allTypes = ['Animal', 'Bird', 'Fish'];
      let score = 0;
      let current = 0;
      let order = [];

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function getRandomWrongType(correctType) {
        const wrongTypes = allTypes.filter(t => t !== correctType);
        return wrongTypes[Math.floor(Math.random() * wrongTypes.length)];
      }

      function nextItem() {
        if (current >= order.length) {
          if (score === items.length) {
            document.getElementById('feedback').textContent = 'Perfect! All correct! 🎉';
            if(window.Celebration) window.Celebration.celebrate();
          } else {
            document.getElementById('feedback').textContent = 'Game Over!';
          }
          document.getElementById('heroItem').textContent = '';
          document.getElementById('choiceA').textContent = '';
          document.getElementById('choiceB').textContent = '';
          return;
        }
        document.getElementById('feedback').textContent = '';
        const item = items[order[current]];
        document.getElementById('heroItem').textContent = item.emoji;
        const correctType = item.type;
        const wrongType = getRandomWrongType(correctType);
        if (Math.random() < 0.5) {
          document.getElementById('choiceA').textContent = correctType;
          document.getElementById('choiceB').textContent = wrongType;
          document.getElementById('choiceA').onclick = function() { handleChoice(correctType); };
          document.getElementById('choiceB').onclick = function() { handleChoice(wrongType); };
        } else {
          document.getElementById('choiceA').textContent = wrongType;
          document.getElementById('choiceB').textContent = correctType;
          document.getElementById('choiceA').onclick = function() { handleChoice(wrongType); };
          document.getElementById('choiceB').onclick = function() { handleChoice(correctType); };
        }
      }

      function handleChoice(choice) {
        if (current >= order.length) return;
        const item = items[order[current]];
        if (choice === item.type) {
          score++;
          document.getElementById('feedback').textContent = '✓ Correct!';
          playBeep(820,0.10,'sine',0.28);
        } else {
          document.getElementById('feedback').textContent = '✗ Wrong!';
          playBeep(320,0.10,'sawtooth',0.22);
        }
        document.getElementById('score').textContent = score;
        current++;
        setTimeout(nextItem, 700);
      }

      function startGame() {
        score = 0;
        current = 0;
        order = shuffle([...Array(items.length).keys()]);
        document.getElementById('score').textContent = '0';
        nextItem();
      }

      startGame();
      document.getElementById('btnShuffle').onclick = function() { startGame(); };
    });
  </script>
  <div id="ageModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Age verification">
    <div class="modal-content">
      <h2>Are you a parent?</h2>
      <p>Please enter your birth year to continue to parental settings.</p>
      <input id="birthYear" type="number" placeholder="e.g. 1980" min="1900" max="2025" />
      <div class="modal-actions">
        <button id="ageSubmit">Confirm</button>
        <button id="ageCancel" class="secondary">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module">
    import { injectNavbar } from '/scripts/navbar-footer.js';
    injectNavbar();
    // Wire up parental modal logic after navbar injection
    window.addEventListener('DOMContentLoaded', () => {
      var parentBtn = document.getElementById('parent-btn');
      if (parentBtn) {
        parentBtn.addEventListener('click', function(){
          if (typeof showParentalGate === 'function') showParentalGate();
        });
      }
      var ageSubmit = document.getElementById('ageSubmit');
      if (ageSubmit) {
        ageSubmit.addEventListener('click', function(){
          const year = parseInt(document.getElementById('birthYear').value || '0', 10);
          if (isNaN(year)) return;
          if (typeof handleParentalConfirm === 'function') handleParentalConfirm(year);
        });
      }
      var ageCancel = document.getElementById('ageCancel');
      if (ageCancel) {
        ageCancel.addEventListener('click', function(){
          if (typeof closeParentalModal === 'function') closeParentalModal();
        });
      }
    });
  </script>
  <script src="/game-shell.js"></script>
</body>
</html>
