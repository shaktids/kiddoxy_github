<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Listen &amp; Tap</title>
  <link rel="icon" href="/kiddoxy.png" type="image/png">
  <link rel="stylesheet" href="/styles/kid-kit.css">
  <style>
    .speaker { display: flex; justify-content: center; margin: 6px 0 16px; }
    .speaker button { width: 110px; height: 110px; border-radius: 50%; font-size: 52px; background: linear-gradient(135deg, #f472b6, #8b5cf6); box-shadow: 0 6px 0 #6d28d9; }
    .speaker button.talking { animation: pulse .8s ease infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 480px; margin: 0 auto; }
    .opt { border: none; border-radius: 20px; background: #fdf4ff; min-height: 110px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 6px 0 #f5d0fe; font-weight: 900; color: #6b21a8; }
    .opt:active { transform: translateY(3px); box-shadow: 0 3px 0 #f5d0fe; }
    .opt .big { font-size: clamp(40px, 11vw, 60px); line-height: 1; }
    .opt .word { font-size: 18px; }
    .opt.correct { background: #dcfce7; box-shadow: 0 6px 0 #86efac; color: #166534; }
    .opt[disabled] { opacity: .35; }
    .hint { text-align: center; min-height: 26px; font-weight: 800; color: #6b7280; }
    .nospeech { background: #fef3c7; border-radius: 12px; padding: 10px; text-align: center; font-weight: 700; }
  </style>
  <script defer src="/scripts/game-brand.js"></script>
  <script defer src="/game-shell.js"></script>
  <script src="/scripts/kid-kit.js"></script>
</head>
<body>
<div class="wrap">
  <header class="game-header">
    <h1>👂 Listen &amp; Tap</h1>
    <div class="hud">
      <span class="pill">Round <span id="round">1</span>/10</span>
      <span class="pill">⭐ <span id="score">0</span></span>
      <button class="btn secondary icon-btn" id="muteBtn" aria-label="Sound">🔊</button>
    </div>
  </header>
  <main class="game-main">
    <div class="panel">
      <div style="display:flex;justify-content:center;margin-bottom:10px">
        <div class="seg" id="modeSeg" role="group" aria-label="Mode">
          <button data-mode="letters" class="active">ABC</button><button data-mode="numbers">123</button><button data-mode="words">Words</button><button data-mode="colors">Colors</button>
        </div>
      </div>
      <div id="nospeech" class="nospeech" hidden>Your browser can't speak out loud, so the answer is written here: <span id="written"></span></div>
      <div class="speaker"><button class="btn" id="speak" aria-label="Hear it again">🔈</button></div>
      <div class="hint" id="hint">Tap the speaker, listen, then tap the right one!</div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <div class="ad-banner">AD_BANNER_PLACEHOLDER</div>
</div>
<script>
(function () {
  const WORDS = [
    ['cat', '🐱'], ['dog', '🐶'], ['sun', '☀️'], ['ball', '⚽'], ['fish', '🐟'], ['tree', '🌳'], ['car', '🚗'], ['apple', '🍎'],
    ['moon', '🌙'], ['star', '⭐'], ['frog', '🐸'], ['cake', '🎂'], ['duck', '🦆'], ['bus', '🚌'], ['bee', '🐝'], ['hat', '🎩'],
    ['book', '📚'], ['egg', '🥚'], ['bird', '🐦'], ['milk', '🥛'],
  ];
  const COLORS = [['red', '#ef4444'], ['blue', '#3b82f6'], ['green', '#22c55e'], ['yellow', '#facc15'], ['orange', '#f97316'], ['purple', '#a855f7'], ['pink', '#ec4899'], ['brown', '#92400e'], ['black', '#111827'], ['white', '#ffffff']];
  const NUMBER_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
  const hasSpeech = 'speechSynthesis' in window;
  const grid = document.getElementById('grid'), hint = document.getElementById('hint'), speakBtn = document.getElementById('speak');
  const roundEl = document.getElementById('round'), scoreEl = document.getElementById('score');
  let mode = 'letters', round = 0, score = 0, target = null, missed = false, busy = false;

  function pool() {
    if (mode === 'letters') return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => ({ say: l, big: l, word: l.toLowerCase() }));
    if (mode === 'numbers') return NUMBER_WORDS.map((w, i) => ({ say: String(i), big: String(i), word: w })).slice(0, 21);
    if (mode === 'words') return WORDS.map(([w, e]) => ({ say: w, big: e, word: w }));
    return COLORS.map(([w, hex]) => ({ say: w, big: `<span style="display:inline-block;width:56px;height:56px;border-radius:50%;background:${hex};border:3px solid #e5e7eb"></span>`, word: w }));
  }
  function phrase(t) {
    if (mode === 'letters') return `Find the letter ${t.say}`;
    if (mode === 'numbers') return `Find the number ${t.say}`;
    if (mode === 'colors') return `Find the color ${t.say}`;
    return `Find the ${t.say}`;
  }
  function say() {
    if (!target) return;
    speakBtn.classList.add('talking'); setTimeout(() => speakBtn.classList.remove('talking'), 1400);
    Kit.speak(phrase(target), 0.85);
  }

  function next() {
    busy = false; missed = false;
    if (round >= 10) return finish();
    round++; roundEl.textContent = round;
    const opts = Kit.shuffle(pool()).slice(0, 4);
    target = Kit.pick(opts);
    grid.innerHTML = '';
    opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'opt';
      // Words mode shows the word under the picture to support early readers; letters/numbers show only the symbol
      b.innerHTML = `<span class="big">${o.big}</span>` + (mode === 'words' || mode === 'colors' ? `<span class="word">${o.word}</span>` : '');
      b.setAttribute('aria-label', o.word);
      b.onclick = () => choose(b, o);
      grid.appendChild(b);
    });
    document.getElementById('written').textContent = phrase(target);
    hint.textContent = hasSpeech ? 'Listen… 👂' : phrase(target);
    setTimeout(say, 350);
  }

  function choose(btn, o) {
    if (busy) return;
    if (o === target) {
      busy = true;
      if (!missed) { score++; scoreEl.textContent = score; }
      btn.classList.add('correct', 'pop');
      hint.textContent = Kit.pick(['Great listening! 🎉', 'Yes! ⭐', 'Super ears! 👂']);
      Kit.sfx.good();
      Kit.speak(o.word === o.say ? `Yes! ${o.say}` : `Yes! ${o.say}, ${o.word}`);
      setTimeout(next, 1500);
    } else {
      missed = true; btn.disabled = true; btn.classList.add('shake');
      Kit.sfx.bad(); hint.textContent = 'Not that one — listen again!';
      setTimeout(say, 400);
    }
  }

  function finish() {
    Kit.sfx.win(); Kit.celebrate();
    const r = Kit.best('listen-tap-' + mode, score);
    Kit.showResult({ emoji: '👂🌟', title: 'Super listener!', text: `You got ${score} of 10 on the first try.` + (r.isNew ? ' New best!' : ''), onAgain: restart });
  }
  function restart() { round = 0; score = 0; scoreEl.textContent = 0; next(); }

  speakBtn.onclick = say;
  document.getElementById('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('active', x === b));
    mode = b.dataset.mode; restart();
  });
  document.getElementById('nospeech').hidden = hasSpeech;
  restart();
})();
</script>
</body>
</html>
