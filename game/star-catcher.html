<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Star Catcher</title>
  <link rel="icon" href="/kiddoxy.png" type="image/png">
  <link rel="stylesheet" href="/styles/kid-kit.css">
  <style>
    .stage { position: relative; width: 100%; max-width: 760px; height: min(68vh, 620px); border-radius: 20px; overflow: hidden; box-shadow: var(--k-shadow); background: linear-gradient(#1e1b4b, #4c1d95 70%, #7c3aed); touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; max-width: none !important; touch-action: none; }
    .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; text-align: center; padding: 16px; background: rgba(30,27,75,.55); }
    .start h2 { margin: 0; font-size: 30px; }
    .start p { margin: 0; max-width: 340px; font-size: 17px; }
  </style>
  <script defer src="/scripts/game-brand.js"></script>
  <script defer src="/game-shell.js"></script>
  <script src="/scripts/kid-kit.js"></script>
</head>
<body>
<div class="wrap">
  <header class="game-header">
    <h1>🌟 Star Catcher</h1>
    <div class="hud">
      <span class="pill">⭐ <span id="score">0</span></span>
      <span class="pill">⏱ <span id="time">45</span>s</span>
      <span class="pill">Best: <span id="best">–</span></span>
      <button class="btn secondary icon-btn" id="muteBtn" aria-label="Sound">🔊</button>
    </div>
  </header>
  <main class="game-main">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="Star catcher play area"></canvas>
      <div class="start" id="start">
        <h2>🧺 Catch the stars!</h2>
        <p>Slide your finger (or use ← →) to move the basket. Catch stars ⭐ and treats 🍓. Dodge the rain clouds 🌧️!</p>
        <button class="btn" id="go">▶ Play</button>
      </div>
    </div>
  </main>
  <div class="ad-banner">AD_BANNER_PLACEHOLDER</div>
</div>
<script>
(function () {
  const GOOD = [{ e: '⭐', p: 1 }, { e: '🌟', p: 2 }, { e: '🍓', p: 1 }, { e: '🍪', p: 1 }, { e: '💎', p: 3 }];
  const BAD = { e: '🌧️', p: -2 };
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), bestEl = document.getElementById('best');
  const startEl = document.getElementById('start');
  let W = 0, H = 0, basket = { x: 0, w: 90 }, items = [], pops = [], score = 0, timeLeft = 45, running = false;
  let last = 0, spawnT = 0, secT = 0, keys = {}, targetX = null;
  const bg = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4 }));
  const b0 = Kit.best('star-catcher'); bestEl.textContent = b0 === null ? '–' : b0;

  function resize() {
    const r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    basket.w = Math.max(70, Math.min(110, W * 0.16));
    if (!basket.x) basket.x = W / 2;
    draw();
  }

  function spawn() {
    const elapsed = 45 - timeLeft;
    const bad = Math.random() < Math.min(0.3, 0.1 + elapsed * 0.005);
    const t = bad ? BAD : GOOD[Math.random() < 0.08 ? 4 : Math.random() < 0.25 ? 1 : Kit.pick([0, 2, 3])];
    items.push({ ...t, x: 24 + Math.random() * (W - 48), y: -30, v: 110 + Math.random() * 60 + elapsed * 3, s: 34, rot: Math.random() * 6 });
  }

  function update(dt) {
    const speed = W * 1.1;
    if (keys.ArrowLeft) basket.x -= speed * dt;
    if (keys.ArrowRight) basket.x += speed * dt;
    if (targetX !== null) basket.x += (targetX - basket.x) * Math.min(1, dt * 14);
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));
    spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 0.8 - (45 - timeLeft) * 0.01); }
    secT += dt; if (secT >= 1) { secT -= 1; timeLeft--; timeEl.textContent = timeLeft; if (timeLeft <= 0) return end(); }
    const by = H - 46;
    items = items.filter(it => {
      it.y += it.v * dt; it.rot += dt * 2;
      if (it.y > by - 18 && it.y < by + 20 && Math.abs(it.x - basket.x) < basket.w / 2 + 10) {
        score = Math.max(0, score + it.p); scoreEl.textContent = score;
        pops.push({ x: it.x, y: by - 30, t: 0.8, txt: (it.p > 0 ? '+' : '') + it.p, col: it.p > 0 ? '#fde047' : '#93c5fd' });
        it.p > 0 ? Kit.beep(700 + it.p * 150, 0.09, 'triangle', 0.15) : Kit.sfx.bad();
        return false;
      }
      return it.y < H + 40;
    });
    pops.forEach(p => { p.t -= dt; p.y -= 40 * dt; }); pops = pops.filter(p => p.t > 0);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    bg.forEach(s => { ctx.globalAlpha = .4 + .4 * Math.sin(performance.now() / 600 + s.x * 20); ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); if (it.p > 0) ctx.rotate(Math.sin(it.rot) * .3); ctx.font = it.s + 'px serif'; ctx.fillText(it.e, 0, 0); ctx.restore(); });
    // basket
    const by = H - 46, bw = basket.w;
    ctx.fillStyle = '#b45309'; roundRect(basket.x - bw / 2, by - 6, bw, 34, 10); ctx.fill();
    ctx.fillStyle = '#f59e0b'; roundRect(basket.x - bw / 2 - 4, by - 12, bw + 8, 12, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) { const x = basket.x - bw / 2 + (bw / 5) * i; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + 26); ctx.stroke(); }
    pops.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.col; ctx.font = 'bold 24px system-ui'; ctx.fillText(p.txt, p.x, p.y); });
    ctx.globalAlpha = 1;
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    update(dt); if (running) { draw(); requestAnimationFrame(loop); }
  }
  function start() {
    score = 0; timeLeft = 45; items = []; pops = []; spawnT = 0; secT = 0; targetX = null;
    scoreEl.textContent = 0; timeEl.textContent = 45; startEl.hidden = true; running = true;
    Kit.sfx.tap(); last = performance.now(); requestAnimationFrame(loop);
  }
  function end() {
    running = false; draw();
    const r = Kit.best('star-catcher', score); bestEl.textContent = r.best;
    Kit.sfx.win(); Kit.celebrate();
    Kit.showResult({ emoji: '🧺⭐', title: 'Time\'s up!', text: `You caught ${score} points of stars.` + (r.isNew ? ' New best!' : ''), onAgain: start });
  }

  const px = e => e.clientX - c.getBoundingClientRect().left;
  c.addEventListener('pointerdown', e => { targetX = px(e); try { c.setPointerCapture(e.pointerId); } catch (_) {} });
  c.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) targetX = px(e); });
  window.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys[e.key] = true; targetX = null; e.preventDefault(); } });
  window.addEventListener('keyup', e => { keys[e.key] = false; });
  document.getElementById('go').onclick = start;
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) { running = false; startEl.hidden = false; document.getElementById('go').textContent = '▶ Resume'; document.getElementById('go').onclick = () => { startEl.hidden = true; running = true; last = performance.now(); requestAnimationFrame(loop); document.getElementById('go').onclick = start; document.getElementById('go').textContent = '▶ Play'; }; } });
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
