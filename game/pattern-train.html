<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pattern Train</title>
  <link rel="icon" href="/kiddoxy.png" type="image/png">
  <link rel="stylesheet" href="/styles/kid-kit.css">
  <style>
    .track { display: flex; gap: 6px; align-items: flex-end; justify-content: center; flex-wrap: wrap; padding: 18px 6px 10px; border-bottom: 6px solid #78350f; background: repeating-linear-gradient(90deg, transparent 0 26px, #a16207 26px 32px) bottom / 100% 6px no-repeat; }
    .car { width: clamp(48px, 13vw, 76px); aspect-ratio: 1; border-radius: 14px 14px 8px 8px; display: flex; align-items: center; justify-content: center; font-size: clamp(26px, 7vw, 42px); background: #fde68a; position: relative; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12); }
    .car::after { content: ''; position: absolute; bottom: -10px; left: 18%; right: 18%; height: 12px; background: radial-gradient(circle at 15% 50%, #374151 5px, transparent 6px), radial-gradient(circle at 85% 50%, #374151 5px, transparent 6px); }
    .car.engine { background: #ef4444; }
    .car.blank { background: #fff; border: 3px dashed #9ca3af; color: #9ca3af; }
    .car.filled { background: #bbf7d0; }
    .choices { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    .choice { width: clamp(70px, 20vw, 100px); aspect-ratio: 1; font-size: clamp(36px, 10vw, 54px); border-radius: 18px; border: none; background: #eef2ff; cursor: pointer; box-shadow: 0 5px 0 #c7d2fe; }
    .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #c7d2fe; }
    .train-go { animation: go 1s ease-in forwards; }
    @keyframes go { to { transform: translateX(110vw); } }
    .stars { text-align: center; font-size: 24px; letter-spacing: 4px; min-height: 30px; }
  </style>
  <script defer src="/scripts/game-brand.js"></script>
  <script defer src="/game-shell.js"></script>
  <script src="/scripts/kid-kit.js"></script>
</head>
<body>
<div class="wrap">
  <header class="game-header">
    <h1>🚂 Pattern Train</h1>
    <div class="hud">
      <span class="pill">Round <span id="round">1</span>/10</span>
      <span class="pill">⭐ <span id="score">0</span></span>
      <button class="btn secondary icon-btn" id="muteBtn" aria-label="Sound">🔊</button>
    </div>
  </header>
  <main class="game-main">
    <div class="panel" style="overflow:hidden">
      <p class="prompt">What comes next on the train?</p>
      <div class="track" id="track" aria-live="polite"></div>
      <div class="choices" id="choices"></div>
      <div class="stars" id="stars"></div>
    </div>
  </main>
  <div class="ad-banner">AD_BANNER_PLACEHOLDER</div>
</div>
<script>
(function () {
  const SETS = [
    ['🍎', '🍌', '🍇', '🍓'], ['🐶', '🐱', '🐰', '🐸'], ['🔴', '🔵', '🟡', '🟢'],
    ['⭐', '🌙', '☀️', '☁️'], ['🚗', '🚌', '🚲', '🚀'], ['🔺', '🟦', '⚪', '🔶'],
  ];
  // Patterns get harder as rounds progress
  const PATTERNS = [['AB'], ['AB', 'AAB'], ['AAB', 'ABB', 'ABC'], ['ABC', 'AABB', 'ABAC'], ['AABB', 'ABAC', 'ABCD', 'ABBC']];
  const track = document.getElementById('track'), choicesEl = document.getElementById('choices');
  const roundEl = document.getElementById('round'), scoreEl = document.getElementById('score'), starsEl = document.getElementById('stars');
  let round = 0, score = 0, answer = null, tries = 0, busy = false;

  function next() {
    round++; tries = 0; busy = false;
    if (round > 10) return finish();
    roundEl.textContent = round;
    const set = Kit.shuffle(Kit.pick(SETS).slice());
    const pat = Kit.pick(PATTERNS[Math.min(PATTERNS.length - 1, Math.floor((round - 1) / 2))]);
    const map = {}; 'ABCD'.split('').forEach((l, i) => map[l] = set[i]);
    const len = Math.min(8, pat.length * 2 + (round > 5 ? 1 : 0));
    const seq = Array.from({ length: len + 1 }, (_, i) => map[pat[i % pat.length]]);
    answer = seq.pop();
    track.classList.remove('train-go');
    track.innerHTML = '<div class="car engine">🚂</div>' + seq.map(s => `<div class="car">${s}</div>`).join('') + '<div class="car blank" id="blank">?</div>';
    const used = [...new Set(pat.split('').map(l => map[l]))];
    const opts = new Set([answer, ...used]);
    while (opts.size < 3) opts.add(Kit.pick(set));
    choicesEl.innerHTML = '';
    Kit.shuffle([...opts]).slice(0, 4).forEach(o => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = o; b.setAttribute('aria-label', 'Choose ' + o);
      b.onclick = () => choose(b, o);
      choicesEl.appendChild(b);
    });
    if (![...choicesEl.children].some(b => b.textContent === answer)) next(); // safety
  }

  function choose(btn, val) {
    if (busy) return;
    if (val === answer) {
      busy = true;
      const blank = document.getElementById('blank');
      blank.textContent = val; blank.className = 'car filled pop';
      const pts = tries === 0 ? 1 : 0; score += pts; scoreEl.textContent = score;
      starsEl.textContent = '⭐'.repeat(score);
      Kit.sfx.good(); Kit.speak(tries === 0 ? Kit.pick(['Great!', 'Choo choo!', 'Yes!', 'Super!']) : 'You got it!');
      setTimeout(() => track.classList.add('train-go'), 500);
      setTimeout(next, 1500);
    } else {
      tries++; btn.classList.add('shake'); btn.disabled = true; btn.style.opacity = .4;
      Kit.sfx.bad();
      setTimeout(() => btn.classList.remove('shake'), 300);
    }
  }

  function finish() {
    Kit.sfx.win(); Kit.celebrate();
    const r = Kit.best('pattern-train', score);
    Kit.showResult({ emoji: '🚂🎉', title: 'All aboard!', text: `You got ${score} of 10 right first time.` + (r.isNew ? ' New best!' : ''), onAgain: restart });
  }
  function restart() { round = 0; score = 0; scoreEl.textContent = 0; starsEl.textContent = ''; next(); }
  restart();
})();
</script>
</body>
</html>
