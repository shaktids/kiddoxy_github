<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Picture Sudoku</title>
  <link rel="icon" href="/kiddoxy.png" type="image/png">
  <link rel="stylesheet" href="/styles/kid-kit.css">
  <style>
    .grid { display: grid; gap: 4px; width: min(90vw, 420px); margin: 0 auto; background: #312e81; padding: 6px; border-radius: 16px; }
    .cell { aspect-ratio: 1; border: none; border-radius: 10px; background: #fff; font-size: clamp(26px, 9vw, 48px); cursor: pointer; padding: 0; }
    .cell.given { background: #e0e7ff; cursor: default; }
    .cell.sel { outline: 4px solid #f59e0b; outline-offset: -4px; }
    .cell.bad { background: #fecaca; }
    .cell.edge-r { margin-right: 4px; }
    .cell.edge-b { margin-bottom: 4px; }
    .palette { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
    .palette button { width: 64px; height: 64px; font-size: 34px; border-radius: 16px; border: none; background: #fef3c7; cursor: pointer; box-shadow: 0 4px 0 #fcd34d; }
    .palette button:active { transform: translateY(2px); }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  </style>
  <script defer src="/scripts/game-brand.js"></script>
  <script defer src="/game-shell.js"></script>
  <script src="/scripts/kid-kit.js"></script>
</head>
<body>
<div class="wrap">
  <header class="game-header">
    <h1>🧩 Picture Sudoku</h1>
    <div class="hud">
      <span class="pill">⏱ <span id="time">0</span>s</span>
      <button class="btn secondary icon-btn" id="muteBtn" aria-label="Sound">🔊</button>
    </div>
  </header>
  <main class="game-main">
    <div class="panel">
      <p class="prompt">Each row, column and box needs one of every picture!</p>
      <div class="row">
        <div class="seg" id="sizeSeg" role="group" aria-label="Size">
          <button data-size="4" class="active">4×4 Easy</button><button data-size="6">6×6 Hard</button>
        </div>
        <button class="btn secondary" id="newBtn">🔄 New</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="palette" id="palette"></div>
      <p class="muted" style="text-align:center">Tap an empty square, then tap a picture. Tap 🧽 to erase.</p>
    </div>
  </main>
  <div class="ad-banner">AD_BANNER_PLACEHOLDER</div>
</div>
<script>
(function () {
  const ICONS = ['🍎', '🐶', '⭐', '🚗', '🌸', '🐟'];
  const gridEl = document.getElementById('grid'), palEl = document.getElementById('palette'), timeEl = document.getElementById('time');
  let N = 4, BR = 2, BC = 2, solution = [], board = [], given = [], sel = -1, timer = null, secs = 0, done = false;

  // Build a valid solved grid with a base pattern, then shuffle rows/cols within bands and the symbols
  function makeSolution() {
    const base = (r, c) => (BC * (r % BR) + Math.floor(r / BR) + c) % N;
    const shuffleGroups = (groups, size) => Kit.shuffle([...Array(groups).keys()]).flatMap(g => Kit.shuffle([...Array(size).keys()]).map(i => g * size + i));
    const rows = shuffleGroups(N / BR, BR), cols = shuffleGroups(N / BC, BC), sym = Kit.shuffle([...Array(N).keys()]);
    return rows.map(r => cols.map(c => sym[base(r, c)]));
  }

  function countSolutions(b, limit = 2) {
    const i = b.indexOf(-1); if (i < 0) return 1;
    let n = 0;
    for (let v = 0; v < N && n < limit; v++) if (ok(b, i, v)) { b[i] = v; n += countSolutions(b, limit); b[i] = -1; }
    return n;
  }
  function ok(b, i, v) {
    const r = Math.floor(i / N), c = i % N;
    for (let k = 0; k < N; k++) { if (b[r * N + k] === v && r * N + k !== i) return false; if (b[k * N + c] === v && k * N + c !== i) return false; }
    const r0 = r - r % BR, c0 = c - c % BC;
    for (let y = r0; y < r0 + BR; y++) for (let x = c0; x < c0 + BC; x++) if (b[y * N + x] === v && y * N + x !== i) return false;
    return true;
  }

  function newGame() {
    BR = N === 4 ? 2 : 2; BC = N === 4 ? 2 : 3;
    solution = makeSolution().flat();
    board = solution.slice();
    // remove cells while the puzzle keeps exactly one solution
    const target = N === 4 ? 8 : 20;
    let removed = 0;
    for (const i of Kit.shuffle([...board.keys()])) {
      if (removed >= target) break;
      const keep = board[i]; board[i] = -1;
      if (countSolutions(board.slice()) !== 1) board[i] = keep; else removed++;
    }
    given = board.map(v => v !== -1);
    sel = board.indexOf(-1); done = false; secs = 0; timeEl.textContent = 0;
    clearInterval(timer); timer = setInterval(() => { if (!done) timeEl.textContent = ++secs; }, 1000);
    render();
  }

  function render() {
    gridEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
    gridEl.innerHTML = '';
    board.forEach((v, i) => {
      const r = Math.floor(i / N), c = i % N;
      const b = document.createElement('button');
      b.className = 'cell' + (given[i] ? ' given' : '') + (i === sel ? ' sel' : '');
      if ((c + 1) % BC === 0 && c < N - 1) b.classList.add('edge-r');
      if ((r + 1) % BR === 0 && r < N - 1) b.classList.add('edge-b');
      if (v !== -1 && !given[i] && !ok(board, i, v)) b.classList.add('bad');
      b.textContent = v === -1 ? '' : ICONS[v];
      b.setAttribute('aria-label', `Row ${r + 1} column ${c + 1}` + (v === -1 ? ' empty' : ' ' + ICONS[v]));
      b.onclick = () => { if (given[i] || done) return; sel = i; Kit.sfx.tap(); render(); };
      gridEl.appendChild(b);
    });
    palEl.innerHTML = '';
    ICONS.slice(0, N).concat('🧽').forEach((ic, v) => {
      const b = document.createElement('button'); b.textContent = ic;
      b.setAttribute('aria-label', ic === '🧽' ? 'Erase' : 'Place ' + ic);
      b.onclick = () => place(ic === '🧽' ? -1 : v);
      palEl.appendChild(b);
    });
  }

  function place(v) {
    if (sel < 0 || given[sel] || done) return;
    board[sel] = v;
    if (v !== -1 && !ok(board, sel, v)) Kit.sfx.bad(); else Kit.beep(600 + v * 80, 0.08, 'triangle', 0.15);
    if (board.every((x, i) => x !== -1 && ok(board, i, x))) return win();
    const nextEmpty = board.findIndex((x, i) => x === -1 && i > sel);
    if (v !== -1 && ok(board, sel, v)) sel = nextEmpty >= 0 ? nextEmpty : board.indexOf(-1);
    render();
  }

  function win() {
    done = true; sel = -1; render(); clearInterval(timer);
    const r = Kit.best('picture-sudoku-' + N, secs, false);
    Kit.sfx.win(); Kit.celebrate();
    setTimeout(() => Kit.showResult({ emoji: '🧩🏆', title: 'Puzzle solved!', text: `Finished in ${secs} seconds.` + (r.isNew ? ' New best!' : ''), onAgain: newGame }), 600);
  }

  document.getElementById('sizeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#sizeSeg button').forEach(x => x.classList.toggle('active', x === b));
    N = Number(b.dataset.size); newGame();
  });
  document.getElementById('newBtn').onclick = newGame;
  window.addEventListener('keydown', e => { const n = Number(e.key); if (n >= 1 && n <= N) place(n - 1); if (e.key === 'Backspace' || e.key === 'Delete') place(-1); });
  newGame();
})();
</script>
</body>
</html>
