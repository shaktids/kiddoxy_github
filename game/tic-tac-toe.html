<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <link rel="icon" href="/kiddoxy.png" type="image/png">
  <link rel="stylesheet" href="/styles/kid-kit.css">
  <style>
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(88vw, 380px); margin: 0 auto; }
    .cell { aspect-ratio: 1; border: none; border-radius: 18px; background: #f1f5f9; font-size: clamp(44px, 14vw, 72px); cursor: pointer; box-shadow: inset 0 -5px 0 #e2e8f0; }
    .cell:disabled { cursor: default; }
    .cell.win { background: #fef08a; animation: kit-pop .4s ease; }
    .status { text-align: center; font-size: 22px; font-weight: 900; min-height: 34px; margin: 4px 0 14px; }
    .tally { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  </style>
  <script defer src="/scripts/game-brand.js"></script>
  <script defer src="/game-shell.js"></script>
  <script src="/scripts/kid-kit.js"></script>
</head>
<body>
<div class="wrap">
  <header class="game-header">
    <h1>❌⭕ Tic-Tac-Toe</h1>
    <div class="hud"><button class="btn secondary icon-btn" id="muteBtn" aria-label="Sound">🔊</button></div>
  </header>
  <main class="game-main">
    <div class="panel">
      <div class="row">
        <div class="seg" id="modeSeg" role="group" aria-label="Opponent">
          <button data-mode="easy" class="active">🐣 Easy bot</button><button data-mode="hard">🦉 Smart bot</button><button data-mode="2p">👫 2 players</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="grid" id="grid"></div>
      <div class="tally">
        <span class="pill"><span id="p1Name">🐶 You</span>: <span id="w1">0</span></span>
        <span class="pill">Draws: <span id="wd">0</span></span>
        <span class="pill"><span id="p2Name">🤖 Bot</span>: <span id="w2">0</span></span>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn" id="again">🔄 New round</button></div>
    </div>
  </main>
  <div class="ad-banner">AD_BANNER_PLACEHOLDER</div>
</div>
<script>
(function () {
  const P = ['🐶', '🐱'];
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const gridEl = document.getElementById('grid'), statusEl = document.getElementById('status');
  let board, turn, over, mode = 'easy', starter = 0, tally = { 0: 0, 1: 0, d: 0 };
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button'); b.className = 'cell'; b.setAttribute('aria-label', 'Square ' + (i + 1));
    b.onclick = () => humanMove(i); gridEl.appendChild(b); cells.push(b);
  }

  function winner(bd) {
    for (const l of LINES) if (bd[l[0]] !== null && bd[l[0]] === bd[l[1]] && bd[l[1]] === bd[l[2]]) return { p: bd[l[0]], line: l };
    return bd.every(x => x !== null) ? { p: 'd' } : null;
  }
  function names() { return mode === '2p' ? [P[0] + ' Player 1', P[1] + ' Player 2'] : [P[0] + ' You', '🤖 Bot']; }
  function setStatus() { statusEl.textContent = `${names()[turn]}'s turn`; }

  function newRound() {
    board = Array(9).fill(null); over = false; turn = starter; starter = 1 - starter;
    cells.forEach(c => { c.textContent = ''; c.disabled = false; c.classList.remove('win'); });
    const n = names(); document.getElementById('p1Name').textContent = n[0]; document.getElementById('p2Name').textContent = n[1];
    setStatus();
    if (mode !== '2p' && turn === 1) setTimeout(botMove, 500);
  }

  function place(i) {
    board[i] = turn; cells[i].textContent = P[turn]; cells[i].disabled = true; cells[i].classList.add('pop');
    Kit.beep(turn ? 520 : 760, 0.08, 'triangle', 0.15);
    const w = winner(board);
    if (w) return finish(w);
    turn = 1 - turn; setStatus();
  }
  function humanMove(i) {
    if (over || board[i] !== null) return;
    if (mode !== '2p' && turn === 1) return;
    place(i);
    if (!over && mode !== '2p') { cells.forEach(c => c.style.pointerEvents = 'none'); setTimeout(() => { botMove(); cells.forEach(c => c.style.pointerEvents = ''); }, 450); }
  }

  function minimax(bd, me) {
    const w = winner(bd);
    if (w) return w.p === 'd' ? 0 : w.p === 1 ? 10 : -10;
    let best = me === 1 ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) if (bd[i] === null) {
      bd[i] = me; const s = minimax(bd, 1 - me); bd[i] = null;
      best = me === 1 ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function botMove() {
    if (over) return;
    const free = board.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
    let move;
    // Easy bot: random most of the time, but takes an obvious win
    const smart = mode === 'hard' || Math.random() < 0.3;
    if (smart) {
      let best = -Infinity, opts = [];
      free.forEach(i => { board[i] = 1; const s = minimax(board, 0); board[i] = null; if (s > best) { best = s; opts = [i]; } else if (s === best) opts.push(i); });
      move = Kit.pick(opts);
    } else {
      const win = free.find(i => { board[i] = 1; const w = winner(board); board[i] = null; return w && w.p === 1; });
      move = win !== undefined ? win : Kit.pick(free);
    }
    place(move);
  }

  function finish(w) {
    over = true; cells.forEach(c => c.disabled = true);
    if (w.p === 'd') { tally.d++; statusEl.textContent = "It's a draw! 🤝"; Kit.beep(440, 0.2); }
    else {
      tally[w.p]++; w.line.forEach(i => cells[i].classList.add('win'));
      const n = names()[w.p];
      if (mode !== '2p' && w.p === 1) { statusEl.textContent = 'The bot wins this time! Try again 💪'; Kit.sfx.bad(); }
      else { statusEl.textContent = `${n} wins! 🎉`; Kit.sfx.win(); Kit.celebrate(); }
    }
    document.getElementById('w1').textContent = tally[0]; document.getElementById('w2').textContent = tally[1]; document.getElementById('wd').textContent = tally.d;
  }

  document.getElementById('again').onclick = newRound;
  document.getElementById('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('active', x === b));
    mode = b.dataset.mode; tally = { 0: 0, 1: 0, d: 0 }; starter = 0;
    ['w1', 'w2', 'wd'].forEach(id => document.getElementById(id).textContent = 0);
    newRound();
  });
  newRound();
})();
</script>
</body>
</html>
